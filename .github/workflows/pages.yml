# Publica la web de Nodo en GitHub Pages cada vez que se sube algo a main.
#
# Arma una copia del sitio en _site/:
#   /index.html             ← Home/html/NODO-WEB-home.html
#   /videos/                ← Home/html/videos (videos de los encabezados; no entran en el HTML)
#   /brochures/*.pdf        ← Home/html/brochures
#   /empresas/ /inversores/ ← direcciones cortas para campañas: redirigen a #/empresas y #/inversores
#   favicon, ícono de iOS e imagen para compartir (og-nodo.jpg)
# Login: el mismo gate.js de ZLT-WEB-PRESENTACIONES y ZLT-WEB-V2 (mismos usuarios), insertado
# justo después de </title>. Sigue en noindex hasta la mudanza del dominio.
# Los archivos originales no se tocan.

name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Armar el sitio
        run: |
          set -euo pipefail
          mkdir -p _site/brochures _site/empresas _site/inversores
          cp Home/html/NODO-WEB-home.html _site/index.html
          cp -r Home/html/videos _site/videos
          cp Home/html/brochures/*.pdf _site/brochures/
          cp Home/iconos/web/favicon.ico Home/iconos/web/apple-touch-icon.png Home/iconos/web/og-nodo.jpg _site/
          cp Home/html/robots.txt _site/robots.txt
          for v in empresas inversores; do
            printf '<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta http-equiv="refresh" content="0; url=../#/%s"><a href="../#/%s">Nodo</a>\n' "$v" "$v" > "_site/$v/index.html"
          done
          # Login (gate.js, copia exacta del de zltdev/presentacion y ZLT-WEB-V2)
          BASE="/${GITHUB_REPOSITORY#*/}"
          cp gate.js _site/gate.js
          f=_site/index.html
          grep -q "src=\"$BASE/gate\.js\"" "$f" || sed -i "0,/<\/title>/s##</title><script src=\"$BASE/gate.js\"></script>#" "$f"
          [ "$(grep -o "$BASE/gate\.js" "$f" | wc -l)" = 1 ] || { echo "El login no quedo una sola vez en $f"; exit 1; }
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
